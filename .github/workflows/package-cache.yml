name: Native package cache
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cache:
    name: ${{ matrix.distro }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            arch: amd64
            runner: ubuntu-24.04
            image: archlinux@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899
          - distro: archarm
            arch: arm64
            runner: ubuntu-24.04-arm
            image: whwmpc-archarm-fixture:20260805
          - distro: fedora
            arch: amd64
            runner: ubuntu-24.04
            image: fedora@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
          - distro: fedora
            arch: arm64
            runner: ubuntu-24.04-arm
            image: fedora@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.4'
      - run: go test -c -o "$RUNNER_TEMP/cache.test" ./internal/actions
      - name: Import the signed Arch Linux ARM fixture
        if: matrix.distro == 'archarm'
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          verification=$(mktemp -d "$RUNNER_TEMP/archarm.XXXXXXXX")
          snapshot="$verification/ArchLinuxARM-2026.08-aarch64-rootfs.tar.gz"
          mirror=https://ca.us.mirror.archlinuxarm.org/os/multi
          curl --proto '=https' -fsSL --retry 2 --max-time 240 "$mirror/${snapshot##*/}" -o "$snapshot"
          curl --proto '=https' -fsSL --retry 2 --max-time 30 "$mirror/${snapshot##*/}.sig" -o "$snapshot.sig"
          curl --proto '=https' -fsSL --retry 2 --max-time 30 https://raw.githubusercontent.com/archlinuxarm/archlinuxarm-keyring/91e6b11698f8df66042d56aaa56fbe9c9263847d/archlinuxarm.gpg -o "$verification/keys.asc"
          printf '%s  %s\n' '42a4eeaa038994ffd31fa173256ef2f0ef511358eeb41b9ea1f8626391b9b319' "$snapshot" | sha256sum --check
          gpg --batch --no-options --homedir "$verification" --dearmor --output "$verification/keys.gpg" "$verification/keys.asc"
          gpgv --homedir "$verification" --keyring "$verification/keys.gpg" --status-fd 1 "$snapshot.sig" "$snapshot" |
            grep -F '[GNUPG:] VALIDSIG 68B3537F39A313B3E574D06777193F152BDBE6A6 '
          docker import --platform linux/arm64 "$snapshot" "$IMAGE"
      - name: Exercise native cleaner on a fixture cache
        env:
          DISTRO: ${{ matrix.distro }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --network none \
            -e "WHWMPC_TEST_CACHE_CONTAINER=$DISTRO" \
            --mount "type=bind,src=$RUNNER_TEMP/cache.test,dst=/cache.test,readonly" \
            "$IMAGE" /cache.test -test.v -test.run '^TestNativePackageManagerContainer$'
