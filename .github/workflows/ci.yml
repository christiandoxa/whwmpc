name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.4'
      - run: test -z "$(git ls-files '*.go' | xargs gofmt -l)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/whwmpc
