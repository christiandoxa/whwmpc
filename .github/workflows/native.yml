name: Native providers
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      WHWMPC_TEST_NATIVE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.4'
      - run: go test -v ./internal/platform ./internal/storage ./internal/filesystem ./internal/power ./internal/diagnostics ./internal/report
      - run: go build -trimpath ./cmd/whwmpc
      - if: runner.os == 'macOS'
        run: ./whwmpc --version
      - if: runner.os == 'Windows'
        run: ./whwmpc.exe --version
