name: Native providers
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      WHWMPC_TEST_NATIVE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.4'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - run: go env GOOS GOARCH
      - run: go test -v ./internal/platform ./internal/storage ./internal/filesystem ./internal/power ./internal/diagnostics ./internal/report
      - run: go build -trimpath ./cmd/whwmpc
      - if: runner.os == 'macOS'
        run: ./whwmpc --version
      - if: runner.os == 'Windows'
        run: ./whwmpc.exe --version
      - name: Exercise the native diagnostic CLI
        if: runner.os == 'macOS' || runner.os == 'Windows'
        env:
          WHWMPC_NATIVE_BINARY: ${{ github.workspace }}/whwmpc${{ runner.os == 'Windows' && '.exe' || '' }}
        run: go test -count=1 -v -run '^TestNativeCLI$' ./cmd/whwmpc
      - name: Repair a temporary ext4 partition
        if: runner.os == 'Linux' && runner.environment == 'github-hosted' && github.event_name == 'push'
        timeout-minutes: 5
        run: python3 scripts/check-ext4-ci.py ./whwmpc
      - name: Exercise a temporary systemd user timer
        if: runner.os == 'Linux' && runner.environment == 'github-hosted' && github.event_name == 'push'
        timeout-minutes: 3
        run: bash scripts/check-daemon-ci.sh ./whwmpc
      - name: Check the thermal guard with fixture sensors
        if: runner.os == 'Linux' && runner.environment == 'github-hosted' && github.event_name == 'push'
        timeout-minutes: 3
        run: python3 scripts/check-benchmark-ci.py ./whwmpc
      - name: Check a temporary APFS image
        if: runner.os == 'macOS' && runner.environment == 'github-hosted'
        timeout-minutes: 5
        run: python3 scripts/check-apfs-ci.py ./whwmpc
      - name: Check a temporary NTFS image
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        shell: pwsh
        timeout-minutes: 5
        run: ./scripts/check-ntfs-ci.ps1 -Checker ./whwmpc.exe
